[package]
name = "moniqi-vmm"
version.workspace = true
edition.workspace = true

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
moniqi-proto = { path = "../proto" }
moniqi-netstack = { path = "../netstack" }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSError", "NSArray", "NSDate", "NSRunLoop", "NSObject", "NSFileHandle"] }
objc2-virtualization = "0.3"
block2 = "0.6"
