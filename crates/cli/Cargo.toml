[package]
name = "moniqi"
version.workspace = true
edition.workspace = true

[[bin]]
name = "moniqi"
path = "src/main.rs"

[dependencies]
moniqi-vmm = { path = "../vmm" }
moniqi-image = { path = "../image" }
moniqi-display = { path = "../display" }
moniqi-governor = { path = "../governor" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
dirs = "6"
ctrlc = "3"
libc = "0.2"
